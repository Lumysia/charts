name: Docker CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: Project directory (empty checks all enabled projects)
        type: string
        required: false
      force:
        description: Build even if no upstream input changed
        type: boolean
        default: false
  schedule:
    # Builds variants whose base images or upstream sources changed, and anything
    # older than MAX_AGE_DAYS so distro package fixes land weekly.
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGCTL_VERSION: v0.11.7

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test build planning
        run: node --test ci/plan.test.mjs

  plan:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install regctl
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/regctl" "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-$(dpkg --print-architecture)"
          chmod +x "$RUNNER_TEMP/bin/regctl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to the registry for lookups
        env:
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        # Authenticated lookups avoid anonymous rate limits; they are optional for planning.
        run: |
          if [ -n "$CONTAINER_REGISTRY" ] && [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_TOKEN" ]; then
            regctl registry login "$CONTAINER_REGISTRY" --user "$REGISTRY_USERNAME" --pass-stdin <<< "$REGISTRY_TOKEN"
          fi
      - name: Select image variants
        id: plan
        env:
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_NAMESPACE: ${{ vars.CONTAINER_NAMESPACE }}
          DEFAULT_BRANCH: main
          MAX_AGE_DAYS: '7'
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PROJECT: ${{ inputs.project }}
          FORCE: ${{ inputs.force }}
          PUBLISH: 'true'
          GITHUB_API_TOKEN: ${{ github.token }}
        run: node ci/plan.mjs > /dev/null

  build:
    name: build (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch upstream source
        if: matrix.source_repo != ''
        env:
          REPO: ${{ matrix.source_repo }}
          SHA: ${{ matrix.source_sha }}
          DIR: ${{ matrix.context }}
        run: |
          set -euo pipefail
          git clone --quiet "$REPO" "$DIR"
          git -C "$DIR" checkout --quiet --detach "$SHA"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.tags }}
          push: ${{ env.PUBLISH == 'true' }}
          pull: true
          no-cache: ${{ matrix.no_cache }}
          cache-from: type=registry,ref=${{ matrix.image }}:${{ matrix.variant }}-buildcache
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:{1}-buildcache,mode=max,ignore-error=true', matrix.image, matrix.variant) || '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=Container image for ${{ matrix.name }}, version ${{ matrix.variant }}. For full details, see the documentation.
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/${{ matrix.readme || 'README.md' }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/main/${{ matrix.name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.variant }}
            ${{ matrix.labels }}
      - name: Update Docker Hub README
        if: env.PUBLISH == 'true' && vars.CONTAINER_REGISTRY == 'docker.io' && matrix.readme != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
          repository: ${{ vars.CONTAINER_NAMESPACE }}/${{ matrix.name }}
          readme-filepath: ${{ matrix.readme }}
          short-description: Container image for ${{ matrix.name }}. For full details, see the documentation.
