; dsh web on :3080, as the desktop user so its tools see the desktop session.
[program:dsh]
command=/opt/dsh/start-dsh.sh
user=cua
environment=HOME="/home/cua",USER="cua",LOGNAME="cua",XDG_RUNTIME_DIR="/run/cua-desktop",DISPLAY=":1"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
priority=50
stdout_logfile=/var/log/supervisor/dsh.log
redirect_stderr=true
